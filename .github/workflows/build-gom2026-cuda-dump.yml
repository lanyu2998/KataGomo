name: Build KataGomo Gom2026 CUDA (transformer models + kata-dump-subtree)

# Builds hzyhhzy/KataGomo Gom2026-cuda-optimized-v2 (supports version 102 transformer
# models like yijing) with the kata-dump-subtree + drawrate GTP patch applied.
# A single exe can load both renju_b18.bin.gz (conv blocks) and yijing-0.4.3.bin.gz
# (transformer_attention/ffn blocks, converted from onnx).
on:
  workflow_dispatch:

jobs:
  build-windows-cuda:
    runs-on: windows-2022
    steps:
      - name: Checkout self (patch files)
        uses: actions/checkout@v4
        with:
          ref: gom2026-cuda-dump

      - name: Checkout upstream Gom2026-cuda-optimized-v2
        uses: actions/checkout@v4
        with:
          repository: hzyhhzy/KataGomo
          ref: Gom2026-cuda-optimized-v2
          path: src

      - name: Apply kata-dump-subtree gtp patch
        shell: pwsh
        run: |
          Copy-Item patches/gom2026-gtp-with-dump.cpp src/cpp/command/gtp.cpp -Force
          Write-Host "gtp.cpp replaced. Marker counts:"
          $t = Get-Content src/cpp/command/gtp.cpp -Raw
          Write-Host ("kata-dump-subtree: " + ([regex]::Matches($t, "kata-dump-subtree")).Count)
          Write-Host ("dumpSubtreeRec: " + ([regex]::Matches($t, "dumpSubtreeRec")).Count)

      - name: Install CUDA toolkit 12.6
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.6.3'
          method: 'local'

      - name: Install zlib via vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg $env:GITHUB_WORKSPACE\vcpkg
          & $env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat
          & $env:GITHUB_WORKSPACE\vcpkg\vcpkg install zlib:x64-windows-release

      - name: Install cuDNN
        shell: pwsh
        run: |
          $url = 'https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.5.1.17_cuda12-archive.zip'
          Invoke-WebRequest -Uri $url -OutFile cudnn.zip
          Expand-Archive -Path cudnn.zip -DestinationPath cudnn
          $root = Get-ChildItem cudnn -Directory | Select-Object -First 1
          "CUDNN_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup MSVC env
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (CMake Ninja + CUDA backend)
        shell: pwsh
        run: |
          $tc = "${env:GITHUB_WORKSPACE}\vcpkg\scripts\buildsystems\vcpkg.cmake"
          cmake -B src/build -S src/cpp `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DUSE_BACKEND=CUDA `
            -DUSE_TCMALLOC=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$tc" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DCMAKE_CUDA_ARCHITECTURES=89 `
            -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler" `
            -DCUDNN_INCLUDE_DIR="$env:CUDNN_ROOT\include" `
            -DCUDNN_LIBRARY="$env:CUDNN_ROOT\lib\x64\cudnn.lib"

      - name: Build
        shell: pwsh
        run: cmake --build src/build --target katago

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: katagomo-gom2026-cuda-dump
          path: |
            src/build/katago.exe
            src/build/*.dll
            cudnn/*/bin/*.dll
